services:

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: icof
      POSTGRES_USER: icof
      POSTGRES_PASSWORD: icof123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icof -d icof"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/Icof.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=icof;Username=icof;Password=icof123"
      BlobStorage__ContainerName: "media"
      BlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: