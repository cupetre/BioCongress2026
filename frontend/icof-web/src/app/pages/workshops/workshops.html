<app-page-hero
  section="Programme"
  title="Workshops"
  kicker="Programme · Hands-on sessions, open for registration"
  description="Small-group, hands-on sessions run by faculty and visiting specialists. Seats are limited, so register early."
/>

<section class="section">
  @if (isAdmin()) {
    <div class="admin-toolbar">
      <button type="button" class="btn-add" (click)="openCreate()">+ Add workshop</button>
    </div>
  }

  <app-item-list
    [items]="workshops()"
    [isAdmin]="isAdmin()"
    (edit)="openEdit($event)"
    (archive)="archive($event)"
  />
</section>

@if (formState() !== 'closed') {
  <app-admin-event-form
    eventType="Workshop"
    [editing]="editingEvent()"
    (saved)="onSaved()"
    (cancelled)="closeForm()"
  />
}
