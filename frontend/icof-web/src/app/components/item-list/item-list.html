<div class="item-list">
  @for (item of items(); track item.id) {
    <div class="item-card">
      <div class="info">
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </div>
      <div class="meta">
        @if (item.status) {
          <span class="status-pill" [class]="'status-' + item.status">{{ item.statusLabel }}</span>
        }
        <span>{{ item.day }} · {{ item.time }}</span>
        <span>{{ item.room }}</span>
      </div>
      @if (isAdmin()) {
        <div class="admin-actions">
          <button type="button" class="admin-btn" (click)="edit.emit(item)">Edit</button>
          <button type="button" class="admin-btn admin-btn-archive" (click)="archive.emit(item)">Archive</button>
        </div>
      }
    </div>
  }
</div>
